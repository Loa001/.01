<!-- Creates a layout with a left-positioned sidenav and explicit content. -->
  <mat-sidenav-container class="container" autosize>
  <mat-sidenav
    mode="side"
    opened
    class="sidenav"
    [class.collapsed]="collapsed()">

    <div class="menu-header">
      <button (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
      </button>
      @if (!collapsed()) {
        <span>Dashboard</span>
      }
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard/clientes">
        <mat-icon matListItemIcon>people</mat-icon>
        @if (!collapsed()) {
          <span matListItemTitle>Clientes</span>
        }
      </a>
      <a mat-list-item routerLink="/dashboard/empleados">
        <mat-icon matListItemIcon>badge</mat-icon>
        @if (!collapsed()) {
          <span matListItemTitle>Empleados</span>
        }
      </a>
      <a mat-list-item routerLink="/dashboard/productos">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        @if (!collapsed()) {
          <span matListItemTitle>Productos</span>
        }
      </a>
      <a mat-list-item routerLink="/dashboard/reportes">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        @if (!collapsed()) {
          <span matListItemTitle>Reportes</span>
        }
      </a>
      <a mat-list-item routerLink="/dashboard/usuarios">
        <mat-icon matListItemIcon>group</mat-icon>
        @if (!collapsed()) {
          <span matListItemTitle>Usuarios</span>
        }
      </a>
      <a mat-list-item (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        @if (!collapsed()) {
          <span matListItemTitle>Cerrar sesión</span>
        }
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
