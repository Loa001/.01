    <!-- Creates a layout with a left-positioned sidenav and explicit content. -->
    <mat-sidenav-container class = "container" autosize>
    <mat-sidenav

        mode = "side"
        opened
        class = "sidenav"
        [class.collapsed]="collapsed()">
    <div class = "menu-header">
        <button
        (click)="toggleMenu()">
        <mat-icon>menu</mat-icon>
        </button>
        
        @if(!collapsed()){
            <span>menu</span>
        }
    </div>
    <mat-nav-list>
        <a mat-list-item>
            <mat-icon matListItemIcon>home</mat-icon>
            @if(!collapsed()){
            <span matListItemTitle>inicio</span>
        }
        </a>
        <a mat-list-item>
            <mat-icon matListItemIcon>manage_accounts</mat-icon>
            @if(!collapsed()){
            <span matListItemTitle>Login</span>
        }
        </a>
    </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>Main</mat-sidenav-content>
    </mat-sidenav-container>
