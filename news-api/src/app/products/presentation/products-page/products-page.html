<section class="page">
  <header>
    <h1>Productos</h1>
    <p>Proveedores de productos</p>
  </header>

  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Proveedor</th>
        <th>Contacto</th>
        <th>Sitio web</th>
      </tr>
    </thead>
    <tbody>
      @for (user of store.users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.company }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.website }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
